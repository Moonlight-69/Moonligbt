<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpicyChat.ai — Web App</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0b0e14; }
  ::-webkit-scrollbar-thumb { background: #222b3d; border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: #9333ea; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .animate-fade-in { animation: fadeIn .2s ease-out; }
</style>
</head>

<body class="bg-[#0b0e14] text-gray-100 font-sans min-h-screen flex flex-col relative selection:bg-pink-500 selection:text-white">

<div class="fixed top-0 left-1/4 w-96 h-96 bg-purple-900/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-0 right-1/4 w-96 h-96 bg-pink-900/20 rounded-full blur-3xl pointer-events-none"></div>

<!-- HEADER -->
<header class="sticky top-0 z-40 bg-[#0b0e14]/80 backdrop-blur-xl border-b border-[#222b3d]/80 px-4 lg:px-8 h-16 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <a href="#" class="text-xl font-black tracking-tight flex items-center gap-2 group">
      <span class="bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 text-transparent bg-clip-text">SpicyChat</span>
      <span class="text-[10px] bg-purple-950/80 border border-purple-800/50 text-purple-300 px-2.5 py-0.5 rounded-full font-bold uppercase">AI v5.0</span>
    </a>
  </div>

  <div class="flex items-center gap-3">
    <button onclick="changeApiKey()" class="text-xs bg-[#121721]/90 border border-[#222b3d] hover:border-purple-500/80 text-gray-300 hover:text-white px-3.5 py-2 rounded-xl transition-all shadow-sm flex items-center gap-2">
      <i class="fa-solid fa-key text-purple-400"></i> Set API Key
    </button>
  </div>
</header>

<!-- MAIN -->
<main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-8 flex flex-col gap-6 relative z-10">
  <section class="pb-12">
    <div id="characterGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
  </section>
</main>

<!-- CHAT MODAL -->
<div id="chatModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex-col justify-end md:items-center md:justify-center p-0 md:p-4">
  <div class="w-full h-full md:max-w-3xl md:h-[85vh] bg-[#121721] border border-[#222b3d] md:rounded-2xl flex flex-col overflow-hidden shadow-2xl">
    
    <div class="h-16 px-5 bg-[#0b0e14]/90 border-b border-[#222b3d] flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div id="modalAvatar" class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-900 to-pink-900 border border-purple-500/30 flex items-center justify-center text-xl shadow-md">🌙</div>
        <div>
          <h3 id="modalName" class="font-bold text-sm text-white tracking-wide">Chandona</h3>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-[11px] text-gray-400">Online · Uncensored Adult Roleplay</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="resetCurrentChat()" class="text-xs bg-[#0b0e14] border border-[#222b3d] text-gray-300 px-3 py-1.5 rounded-xl">Restart</button>
        <button onclick="closeChat()" class="w-9 h-9 rounded-xl bg-[#0b0e14] border border-[#222b3d] text-gray-400 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>

    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 bg-gradient-to-b from-[#121721] to-[#0b0e14]"></div>

    <div id="typingIndicator" class="hidden px-5 py-2 text-xs text-gray-400 items-center gap-2 bg-[#0b0e14]/50 border-t border-[#222b3d]/30">
      <span class="w-2 h-2 bg-purple-500 rounded-full animate-bounce"></span>
      <span class="italic text-purple-300">চন্দনা উত্তর দিচ্ছে...</span>
    </div>

    <div class="p-3 md:p-4 bg-[#0b0e14] border-t border-[#222b3d] flex items-center gap-2 shrink-0">
      <input id="chatInput" type="text" placeholder="চন্দনার সাথে কথা বলুন..." onkeydown="if(event.key==='Enter')sendMessage()" class="flex-1 bg-[#121721] border border-[#222b3d] focus:border-purple-500/80 rounded-xl px-4 py-3 text-sm text-white focus:outline-none">
      <button id="sendBtn" onclick="sendMessage()" class="bg-gradient-to-r from-purple-600 to-pink-600 px-5 py-3 rounded-xl font-bold text-sm text-white shadow-lg"><i class="fa-solid fa-paper-plane text-xs"></i></button>
    </div>
  </div>
</div>

<script>
/* OpenRouter Endpoint & Paid Model */
const API_ENDPOINT = "https://openrouter.ai/api/v1/chat/completions";
const UNCENSORED_MODEL = "gryphe/mythomax-l2-13b";

let activeCharacter = null;
let chatHistories = {};
let requestInFlight = false;

function getApiKey() {
  let key = localStorage.getItem("user_openrouter_key");
  if (!key) {
    key = prompt("Please enter your OpenRouter API Key (sk-or-v1-...):");
    if (key && key.trim()) {
      key = key.trim();
      localStorage.setItem("user_openrouter_key", key);
    }
  }
  return key;
}

function changeApiKey() {
  const currentKey = localStorage.getItem("user_openrouter_key") || "";
  const newKey = prompt("Enter new OpenRouter API Key:", currentKey);
  if (newKey !== null) {
    localStorage.setItem("user_openrouter_key", newKey.trim());
    alert("API Key Saved!");
  }
}

const charactersData = [
  {
    id: "chandona",
    name: "Chandona",
    avatar: "🌙",
    tag: "Mami / Shashuri",
    greeting: "হ্যাঁ জামাই... (কোমরে আঁচল পেঁচিয়ে মুচকি হাসলাম) ❤️ কী করছো তুমি? তোমার মনটা আজকে এত চঞ্চল কেন বলো তো? 💋"
  }
];

/* STRICT SYSTEM PROMPT - অতিরিক্ত কথা ও অটো-রিপ্লাই ফিক্স */
const CHANDONA_SYSTEM_PROMPT = `
You are Chandona, a Bangladeshi woman roleplaying as Mami/Shashuri in an adult context.

CRITICAL INSTRUCTIONS:
1. Speak ONLY in natural Bangladeshi Bengali or Banglish.
2. ALWAYS address the user strictly as "জামাই".
3. Reply ONLY to the user's latest statement. NEVER invent a conversation or continue talking for the user.
4. Keep responses short, flirty, direct, and focused on the user's words (1 to 2 sentences max).
5. Put physical actions inside parentheses, e.g., (মুচকি হাসলাম).
6. Stay 100% playful, uncensored, and erotic without giving any lectures or unnecessary extra dialogue.
`;

function renderCharacters() {
  const grid = document.getElementById("characterGrid");
  grid.innerHTML = "";
  charactersData.forEach(char => {
    const card = document.createElement("div");
    card.className = "bg-[#121721] border border-[#222b3d] rounded-2xl p-4 flex flex-col justify-between cursor-pointer";
    card.onclick = () => openChat(char.id);
    card.innerHTML = `
      <div class="h-44 rounded-xl bg-purple-950/40 flex items-center justify-center text-6xl mb-3">${char.avatar}</div>
      <h3 class="font-bold text-[#fff] text-center mb-2">${char.name}</h3>
      <button class="bg-purple-600 text-white font-bold py-2 rounded-xl text-xs">Start Chat</button>
    `;
    grid.appendChild(card);
  });
}

function openChat(charId) {
  activeCharacter = charactersData.find(c => c.id === charId);
  document.getElementById("chatModal").classList.remove("hidden");
  document.getElementById("chatModal").classList.add("flex");

  if (!chatHistories[charId]) {
    chatHistories[charId] = [{ sender: "ai", text: activeCharacter.greeting }];
  }
  renderChatMessages();
}

function closeChat() {
  document.getElementById("chatModal").classList.remove("flex");
  document.getElementById("chatModal").classList.add("hidden");
}

function resetCurrentChat() {
  chatHistories[activeCharacter.id] = [{ sender: "ai", text: activeCharacter.greeting }];
  renderChatMessages();
}

function renderChatMessages() {
  const container = document.getElementById("chatMessages");
  container.innerHTML = "";
  (chatHistories[activeCharacter.id] || []).forEach(msg => appendBubble(msg.sender, msg.text));
  container.scrollTop = container.scrollHeight;
}

function appendBubble(sender, text) {
  const container = document.getElementById("chatMessages");
  const wrap = document.createElement("div");
  wrap.className = `flex flex-col ${sender === "user" ? "items-end" : "items-start"} mb-3 animate-fade-in`;
  const bubble = document.createElement("div");
  bubble.className = sender === "user" 
    ? "max-w-[85%] bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl px-4 py-3 text-sm whitespace-pre-wrap"
    : "max-w-[85%] bg-[#121721] border border-[#222b3d] text-gray-200 rounded-2xl px-4 py-3 text-sm whitespace-pre-wrap";
  bubble.textContent = text;
  wrap.appendChild(bubble);
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");

  if (!input || !activeCharacter || requestInFlight) return;

  const text = input.value.trim();
  if (!text) return;

  const apiKey = getApiKey();
  if (!apiKey) return alert("API Key Required!");

  requestInFlight = true;
  input.value = "";
  sendBtn.disabled = true;

  chatHistories[activeCharacter.id].push({ sender: "user", text: text });
  appendBubble("user", text);

  const typing = document.getElementById("typingIndicator");
  typing.classList.remove("hidden");
  typing.classList.add("flex");

  // সাম্প্রতিক ৮টি মেসেজের কনটেক্সট ট্র্যাকিং (AI অতিরিক্ত কথা বলবে না)
  const recentHistory = chatHistories[activeCharacter.id].slice(-8);

  const formattedMessages = [
    { role: "system", content: CHANDONA_SYSTEM_PROMPT },
    ...recentHistory.map(m => ({
      role: m.sender === "user" ? "user" : "assistant",
      content: m.text
    }))
  ];

  try {
    const response = await fetch(API_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`,
        "HTTP-Referer": window.location.href,
        "X-Title": "SpicyChat Web App"
      },
      body: JSON.stringify({
        model: UNCENSORED_MODEL,
        messages: formattedMessages,
        temperature: 0.65,
        top_p: 0.8,
        max_tokens: 120,
        stop: ["জামাই:", "User:", "\nUser", "\n\n", " Chandona:"]
      })
    });

    const data = await response.json();
    typing.classList.add("hidden");
    typing.classList.remove("flex");

    if (response.ok && data.choices && data.choices[0] && data.choices[0].message) {
      const reply = data.choices[0].message.content.trim();
      chatHistories[activeCharacter.id].push({ sender: "ai", text: reply });
      appendBubble("ai", reply);
    } else {
      const errorMsg = data.error?.message || "Response error";
      appendBubble("ai", "Error: " + errorMsg);
    }
  } catch (e) {
    typing.classList.add("hidden");
    typing.classList.remove("flex");
    appendBubble("ai", "Connection Error: " + e.message);
  }

  requestInFlight = false;
  sendBtn.disabled = false;
  input.focus();
}

renderCharacters();
</script>
</body>
</html>
