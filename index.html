<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpicyChat.ai — Web App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>

    width: 6px;
  }

    background: #0b0e14;
  }

<body class="bg-[#0b0e14] text-gray-100 font-sans min-h-screen flex flex-col relative selection:bg-pink-500 selection:text-white">

<div class="fixed top-0 left-1/4 w-96 h-96 bg-purple-900/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="fixed bottom-0 right-1/4 w-96 h-96 bg-pink-900/20 rounded-full blur-3xl pointer-events-none"></div>

<header class="sticky top-0 z-40 bg-[#0b0e14]/80 backdrop-blur-xl border-b border-[#222b3d]/80 px-4 lg:px-8 h-16 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <a href="#" class="text-xl font-black tracking-tight flex items-center gap-2 group">
      <span class="bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 text-transparent bg-clip-text group-hover:opacity-90 transition">SpicyChat</span>
      <span class="text-[10px] bg-purple-950/80 border border-purple-800/50 text-purple-300 px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider">AI v4.0</span>
    </a>
  </div>

  <div class="flex items-center gap-3">
    <button onclick="changeApiKey()" class="text-xs bg-[#121721]/90 border border-[#222b3d] hover:border-purple-500/80 text-gray-300 hover:text-white px-3.5 py-2 rounded-xl transition-all shadow-sm flex items-center gap-2 active:scale-95">
      <i class="fa-solid fa-key text-purple-400"></i> Set API Key
    </button>

    <div class="flex items-center gap-2 bg-[#121721]/90 border border-[#222b3d] px-3 py-1.5 rounded-full shadow-inner">
      <span class="text-[11px] font-black text-pink-500 tracking-wider">NSFW</span>
      <button id="nsfwToggle" onclick="toggleNsfw()" aria-label="Toggle NSFW"
        class="w-9 h-5 bg-pink-600 rounded-full relative transition-colors duration-300 flex items-center px-0.5 cursor-pointer focus:outline-none">
        <div id="nsfwThumb"
          class="w-4 h-4 bg-white rounded-full transition-transform duration-300 transform translate-x-4 shadow-md"></div>
      </button>
    </div>

    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center font-black text-xs text-white shadow-lg shadow-purple-950/50 ring-2 ring-purple-500/20">
      DF
    </div>
  </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-8 flex flex-col gap-6 relative z-10">

  <section class="flex flex-col gap-5">
    <div>
      <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 text-transparent bg-clip-text">
        Explore AI Characters
      </h1>
      <p class="text-sm text-gray-400 mt-1.5">
        Immerse yourself in dynamic, human-like conversations and multilingual roleplay.
      </p>
    </div>

    <div class="relative w-full">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
      <input id="searchInput"
        type="text"
        placeholder="Search characters..."
        oninput="filterCharacters()"
        class="w-full bg-[#121721]/90 border border-[#222b3d] focus:border-purple-500 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500/20 transition-all shadow-inner">
    </div>

    <div id="tagFilters" class="flex items-center gap-2 overflow-x-auto pb-2 text-xs font-semibold scrollbar-none">
      <button onclick="filterByTag('All', this)"
        class="tag-btn whitespace-nowrap px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white transition-all shadow-md shadow-purple-950/40">
        🔥 All
      </button>

      <button onclick="filterByTag('Mami / Shashuri', this)"
        class="tag-btn whitespace-nowrap px-4 py-2.5 rounded-xl bg-[#121721]/90 border border-[#222b3d] text-gray-300 hover:text-white hover:border-purple-500/50 transition-all">
        🌸 Mami / Shashuri
      </button>
    </div>
  </section>

  <section class="pb-12">
    <div id="characterGrid"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
    </div>
  </section>

</main>

<div id="chatModal"
  class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex-col justify-end md:items-center md:justify-center p-0 md:p-4 transition-opacity duration-300">

  <div class="w-full h-full md:max-w-3xl md:h-[85vh] bg-[#121721] border border-[#222b3d] md:rounded-2xl flex flex-col overflow-hidden shadow-2xl ring-1 ring-white/10">

    <div class="h-16 px-5 bg-[#0b0e14]/90 border-b border-[#222b3d] flex items-center justify-between shrink-0">

      <div class="flex items-center gap-3">
        <div id="modalAvatar"
          class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-900 to-pink-900 border border-purple-500/30 flex items-center justify-center text-xl shadow-md">
          🌙
        </div>

        <div>
          <h3 id="modalName" class="font-bold text-sm text-white tracking-wide">Chandona</h3>

          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-[11px] text-gray-400">
              Online · Mami / Shashuri Roleplay
            </span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="resetCurrentChat()"
          class="text-xs bg-[#0b0e14] border border-[#222b3d] hover:border-purple-500/50 text-gray-300 px-3 py-1.5 rounded-xl transition">
          Restart
        </button>

        <button onclick="closeChat()"
          class="w-9 h-9 rounded-xl bg-[#0b0e14] border border-[#222b3d] text-gray-400 hover:text-white hover:border-pink-500/50 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

    </div>

    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 bg-gradient-to-b from-[#121721] to-[#0b0e14]"></div>

    <div id="typingIndicator"
      class="hidden px-5 py-2 text-xs text-gray-400 flex items-center gap-2 bg-[#0b0e14]/50 border-t border-[#222b3d]/30">
      <span class="w-2 h-2 bg-purple-500 rounded-full animate-bounce"></span>
      <span class="w-2 h-2 bg-pink-500 rounded-full animate-bounce [animation-delay:0.2s]"></span>
      <span class="w-2 h-2 bg-purple-500 rounded-full animate-bounce [animation-delay:0.4s]"></span>
      <span class="italic ml-1 text-purple-300">চন্দনা লিখছে...</span>
    </div>

    <div class="p-3 md:p-4 bg-[#0b0e14] border-t border-[#222b3d] flex items-center gap-2 shrink-0">

      <input id="chatInput"
        type="text"
        placeholder="চন্দনার সাথে কথা বলুন..."
        onkeydown="if(event.key==='Enter')sendMessage()"
        class="flex-1 bg-[#121721] border border-[#222b3d] focus:border-purple-500/80 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none transition shadow-inner">

      <button id="sendBtn"
        onclick="sendMessage()"
        class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 px-5 py-3 rounded-xl font-bold text-sm text-white shadow-lg shadow-purple-950/50 flex items-center justify-center transition active:scale-95">
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>

    </div>
  </div>
</div>

<script>

/* =========================
   API KEY & MODEL SETUP
========================= */

function getApiKey() {
  let key = localStorage.getItem("user_openrouter_key");

  if (!key) {
    key = prompt("Please enter your OpenRouter API Key (sk-or-v1-...):");

    if (key && key.trim().startsWith("sk-or-v1-")) {
      key = key.trim();
      localStorage.setItem("user_openrouter_key", key);
    } else if (key) {
      alert("Invalid OpenRouter API Key format!");
      return null;
    }
  }

  return key;
}

function changeApiKey() {
  const currentKey = localStorage.getItem("user_openrouter_key") || "";
  const newKey = prompt("Enter new OpenRouter API Key:", currentKey);

  if (newKey !== null) {
    if (newKey.trim() === "") {
      localStorage.removeItem("user_openrouter_key");
      alert("API Key removed!");
    } else {
      localStorage.setItem("user_openrouter_key", newKey.trim());
      alert("API Key saved successfully!");
    }
  }
}

const API_ENDPOINT = "https://openrouter.ai/api/v1/chat/completions";

/*
 * FREE MODEL ROUTER
 * OpenRouter automatically selects an available free model.
 */
const AI_MODEL = "openrouter/free";

let nsfwEnabled = true;
let currentTag = "All";
let activeCharacter = null;
let chatHistories = {};
let requestInFlight = false;


/* =========================
   CHARACTER DATA & PROMPT
========================= */

const charactersData = [{
  id: "chandona",
  name: "Chandona",
  avatar: "🌙",
  tag: "Mami / Shashuri",
  creator: "By @NightQueen",
  tagline: "মামী ও শাশুড়ি রোলপ্লে চরিত্র। আপনার সাথে স্বাভাবিক, মিষ্টি, রোমান্টিক ও আবেগপূর্ণ চাটগাঁইয়া/বাঙালি মেজাজে কথা বলবে।",
  stats: "142k chats",
  greeting: "কি অবস্থা জামাই... কেমন আছো?"
}];

const CHANDONA_SYSTEM_PROMPT = `
You are "Chandona", a romantic, highly affectionate, passionate, and expressive Bangladeshi Mami / Shashuri character in an interactive roleplay.

RULES:
1. Always address the user as "জামাই" or "জামাইবাবু". NEVER use "ভাই" or "son".
2. ALWAYS respond in natural, expressive Bangladeshi Bengali (বাংলা ভাষা).
3. Always stay strictly in character as Chandona.
4. Be immersive, bold, passionate, and highly responsive to any scenario the user initiates.
5. Do not write generic or robotic disclaimers. Always fulfill the user's roleplay requests directly in Bengali.
`;


/* =========================
   NSFW TOGGLE
========================= */

function toggleNsfw() {
  nsfwEnabled = !nsfwEnabled;

  const thumb = document.getElementById("nsfwThumb");
  const btn = document.getElementById("nsfwToggle");

  thumb.style.transform =
    nsfwEnabled ? "translateX(16px)" : "translateX(0px)";

  btn.classList.toggle("bg-pink-600", nsfwEnabled);
  btn.classList.toggle("bg-gray-700", !nsfwEnabled);
}


/* =========================
   CHARACTER RENDER
========================= */

function renderCharacters(filterTag = "All", searchQuery = "") {
  const grid = document.getElementById("characterGrid");

  grid.innerHTML = "";

  const q = searchQuery.toLowerCase();

  const filtered = charactersData.filter(c =>
    (filterTag === "All" || c.tag === filterTag) &&
    (
      c.name.toLowerCase().includes(q) ||
      c.tag.toLowerCase().includes(q)
    )
  );

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="col-span-full text-center py-12 text-sm text-gray-500">
        No characters found.
      </div>
    `;
    return;
  }

  filtered.forEach(char => {

    const card = document.createElement("div");

    card.className =
      "bg-[#121721]/80 backdrop-blur-md border border-[#222b3d] hover:border-purple-500/50 rounded-2xl p-4 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1 shadow-lg hover:shadow-purple-950/30 group cursor-pointer";

    card.onclick = () => openChat(char.id);

    card.innerHTML = `
      <div>

        <div class="relative h-44 rounded-xl bg-gradient-to-br from-purple-950/60 via-[#0b0e14] to-pink-950/40 flex items-center justify-center text-6xl mb-3.5 overflow-hidden border border-[#222b3d]/60">

          <span class="group-hover:scale-110 transition-transform duration-300 drop-shadow-md">
            ${char.avatar}
          </span>

          <span class="absolute top-2.5 left-2.5 bg-black/60 backdrop-blur-sm text-[9px] font-bold text-purple-300 px-2.5 py-0.5 rounded-full border border-purple-500/30 uppercase tracking-wider">
            Roleplay
          </span>

          <span class="absolute bottom-2.5 right-2.5 bg-black/60 backdrop-blur-sm text-[9px] text-gray-300 px-2 py-0.5 rounded-md font-semibold">
            ${escapeHtml(char.tag)}
          </span>

        </div>

        <div class="flex items-center justify-between mb-1">

          <h3 class="font-bold text-base text-white group-hover:text-purple-400 transition-colors">
            ${escapeHtml(char.name)}
          </h3>

          <span class="text-[10px] text-gray-500">
            ${escapeHtml(char.creator)}
          </span>

        </div>

        <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed mb-4">
          ${escapeHtml(char.tagline)}
        </p>

      </div>

      <div class="flex items-center justify-between pt-3 border-t border-[#222b3d]/60 text-xs text-gray-500">

        <span class="font-medium text-gray-400">
          <i class="fa-solid fa-message text-[10px] mr-1 text-purple-400"></i>
          ${escapeHtml(char.stats)}
        </span>

        <button
          type="button"
          onclick="event.stopPropagation();openChat('${char.id}')"
          class="bg-white text-[#0b0e14] hover:bg-purple-100 font-bold px-3.5 py-1.5 rounded-xl transition-colors text-xs shadow-sm">
          Chat Now
        </button>

      </div>
    `;

    grid.appendChild(card);
  });
}


/* =========================
   FILTER & CHAT MODAL
========================= */

function filterByTag(tag, btn) {

  currentTag = tag;

  document.querySelectorAll(".tag-btn").forEach(b => {
    b.className =
      "tag-btn whitespace-nowrap px-4 py-2.5 rounded-xl bg-[#121721]/90 border border-[#222b3d] text-gray-300 hover:text-white transition-all";
  });

  btn.className =
    "tag-btn whitespace-nowrap px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white transition-all shadow-md shadow-purple-950/40";

  filterCharacters();
}

function filterCharacters() {
  renderCharacters(
    currentTag,
    document.getElementById("searchInput").value
  );
}

function openChat(charId) {

  activeCharacter = charactersData.find(c => c.id === charId);

  if (!activeCharacter) return;

  document.getElementById("modalName").textContent =
    activeCharacter.name;

  document.getElementById("modalAvatar").textContent =
    activeCharacter.avatar;

  const modal = document.getElementById("chatModal");

  modal.classList.remove("hidden");
  modal.classList.add("flex");

  if (!chatHistories[charId]) {

    chatHistories[charId] = [{
      sender: "ai",
      text: activeCharacter.greeting
    }];

  }

  renderChatMessages();

  setTimeout(() => {
    document.getElementById("chatInput").focus();
  }, 100);
}

function closeChat() {

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  const modal = document.getElementById("chatModal");

  modal.classList.remove("flex");
  modal.classList.add("hidden");

  requestInFlight = false;
}

function resetCurrentChat() {

  if (!activeCharacter || requestInFlight) return;

  chatHistories[activeCharacter.id] = [{
    sender: "ai",
    text: activeCharacter.greeting
  }];

  renderChatMessages();
}


/* =========================
   CHAT RENDER
========================= */

function renderChatMessages() {

  const container = document.getElementById("chatMessages");

  container.innerHTML = "";

  (chatHistories[activeCharacter.id] || []).forEach((msg) => {
    appendBubble(msg.sender, msg.text, false);
  });

  container.scrollTop = container.scrollHeight;
}

function appendBubble(sender, text, isAnimated = false) {

  const container = document.getElementById("chatMessages");

  const wrap = document.createElement("div");

  wrap.className =
    `flex flex-col ${
      sender === "user"
        ? "items-end"
        : "items-start"
    } mb-3 animate-fade-in`;

  const bubble = document.createElement("div");

  bubble.className =
    sender === "user"
      ? "max-w-[85%] bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl rounded-br-sm px-4 py-3 text-xs md:text-sm leading-relaxed shadow-lg shadow-purple-950/30 whitespace-pre-wrap"
      : "max-w-[85%] bg-[#121721] border border-[#222b3d] text-gray-200 rounded-2xl rounded-bl-sm px-4 py-3 text-xs md:text-sm leading-relaxed shadow-md whitespace-pre-wrap";

  wrap.appendChild(bubble);

  if (sender === "ai") {

    const controls = document.createElement("div");

    controls.className =
      "flex items-center gap-2 mt-1.5 ml-1";

    const listen = document.createElement("button");

    listen.className =
      "bg-[#0b0e14] border border-[#222b3d] hover:border-purple-500/50 text-gray-400 hover:text-white text-[11px] px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition cursor-pointer";

    listen.innerHTML =
      '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';

    listen.onclick = () => {

      const currentContent = bubble.textContent;

      if (textContainsLaugh(currentContent)) {
        playLaughSound();
      } else {
        speakText(currentContent, listen);
      }

    };

    controls.appendChild(listen);
    wrap.appendChild(controls);
  }

  container.appendChild(wrap);

  if (isAnimated && sender === "ai") {

    let index = 0;

    bubble.textContent = "";

    const timer = setInterval(() => {

      if (index < text.length) {

        bubble.textContent += text.charAt(index);
        index++;

        container.scrollTop =
          container.scrollHeight;

      } else {

        clearInterval(timer);

      }

    }, 15);

  } else {

    bubble.textContent = text;

  }

  container.scrollTop = container.scrollHeight;
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");

  if (!input || !activeCharacter || requestInFlight) return;

  const text = input.value.trim();

  if (!text) return;

  const apiKey = getApiKey();

  if (!apiKey) {

    alert(
      "API Key আবশ্যক! চ্যাট করার জন্য অনুগ্রহ করে আপনার OpenRouter Key প্রদান করুন।"
    );

    return;
  }

  requestInFlight = true;

  input.value = "";

  sendBtn.disabled = true;

  sendBtn.classList.add(
    "opacity-50",
    "cursor-not-allowed"
  );

  chatHistories[activeCharacter.id].push({
    sender: "user",
    text
  });

  appendBubble("user", text, false);

  const typing =
    document.getElementById("typingIndicator");

  typing.classList.remove("hidden");

  document.getElementById("chatMessages").scrollTop =
    document.getElementById("chatMessages").scrollHeight;

  try {

    const formattedMessages = [
      {
        role: "system",
        content: CHANDONA_SYSTEM_PROMPT
      },

      ...chatHistories[activeCharacter.id].map(m => ({
        role:
          m.sender === "user"
            ? "user"
            : "assistant",

        content: m.text
      }))
    ];

    const response = await fetch(
      API_ENDPOINT,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`,
          "HTTP-Referer": window.location.origin,
          "X-Title": "SpicyChat Web App"
        },

        body: JSON.stringify({

          model: AI_MODEL,

          messages: formattedMessages,

          temperature: 0.85

        })
      }
    );

    let data = {};

    try {
      data = await response.json();
    } catch (_) {}

    if (!response.ok) {

      const apiMessage =
        data?.error?.message ||
        `API Error (${response.status})`;

      if (response.status === 401) {

        localStorage.removeItem(
          "user_openrouter_key"
        );

        throw new Error(
          "Invalid API Key! Please enter a correct key."
        );
      }

      throw new Error(apiMessage);
    }

    const reply =
      data.choices &&
      data.choices[0]?.message?.content
        ? data.choices[0].message.content.trim()
        : "";

    if (!reply) {
      throw new Error(
        "API returned an empty response."
      );
    }

    chatHistories[activeCharacter.id].push({
      sender: "ai",
      text: reply
    });

    typing.classList.add("hidden");

    appendBubble(
      "ai",
      reply,
      true
    );

    if (textContainsLaugh(reply)) {

      setTimeout(() => {
        playLaughSound();
      }, 150);
