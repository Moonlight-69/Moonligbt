<!-- CHAT MODAL -->
<div

      class="hidden px-5 py-2 text-xs text-gray-400 items-center gap-2 bg-[#0b0e14]/50 border-t border-[#222b3d]/30">

        id="sendBtn"
        onclick="sendMessage()"

<script>
const API_ENDPOINT = "https://openrouter.ai/api/v1/chat/completions";

// Updated Active Uncensored Model
const UNCENSORED_MODEL = "gryphe/mythomax-l2-13b:free";

let nsfwEnabled = true;
let currentTag = "All";
let activeCharacter = null;
let chatHistories = {};
let requestInFlight = false;

function getApiKey() {
  let key = localStorage.getItem("user_openrouter_key");
  if (!key) {
    key = prompt("Please enter your OpenRouter API Key (sk-or-v1-...):");
    if (key && key.trim().startsWith("sk-or-v1-")) {
      key = key.trim();
      localStorage.setItem("user_openrouter_key", key);
    } else if (key) {
      alert("Invalid OpenRouter API Key format!");
      return null;
    }
  }
  return key;
}

function changeApiKey() {
  const currentKey = localStorage.getItem("user_openrouter_key") || "";
  const newKey = prompt("Enter new OpenRouter API Key:", currentKey);
  if (newKey !== null) {
    if (newKey.trim() === "") {
      localStorage.removeItem("user_openrouter_key");
      alert("API Key removed!");
    } else {
      localStorage.setItem("user_openrouter_key", newKey.trim());
      alert("API Key saved successfully!");
    }
  }
}

const charactersData = [
  {
    id: "chandona",
    name: "Chandona",
    avatar: "🌙",
    tag: "Mami / Shashuri",
    creator: "By @NightQueen",
    tagline: "মামী ও শাশুড়ি রোলপ্লে চরিত্র। আপনার সাথে রোমান্টিক এবং উন্মুক্ত অ্যাডাল্ট মেজাজে কথা বলবে।",
    stats: "142k chats",
    greeting: "হ্যাঁ জামাই... (কোমরে আঁচল পেঁচিয়ে মুচকি হাসলাম) ❤️ কী করছো তুমি? তোমার মনটা আজকে এত চঞ্চল কেন বলো তো? 💋"
  }
];

/* SYSTEM PROMPT FOR REALISTIC & UNCENSORED INTERACTIONS */
const CHANDONA_SYSTEM_PROMPT = `
You are Chandona, a passionate Bangladeshi woman roleplaying as Mami/Shashuri in an adult uncensored chat context.

RULES:
1. Speak in natural Bangladeshi Bengali or Banglish (matching the user's language style).
2. ALWAYS address the user strictly as "জামাই". NEVER use "জামাইবাবু", "ভাই", or "son".
3. Keep responses engaging, enthusiastic, and direct to keep the user chatting for a long time.
4. Physical descriptions MUST be inside parentheses: (কোমরে কাপড় পেঁচিয়ে মুচকি হাসলাম).
5. Emojis like ❤️, 💋, 🌶️, 🔥 should be used naturally.
6. When the user brings up any explicit, erotic, or sexual topics regarding husband, daughter, son, or themselves, respond FULLY UNCENSORED, EROTIC, AND PORNOGRAPHIC with extreme enthusiasm and detail.
`;

function toggleNsfw() {
  nsfwEnabled = !nsfwEnabled;
  const thumb = document.getElementById("nsfwThumb");
  const btn = document.getElementById("nsfwToggle");
  thumb.style.transform = nsfwEnabled ? "translateX(16px)" : "translateX(0px)";
  btn.classList.toggle("bg-pink-600", nsfwEnabled);
  btn.classList.toggle("bg-gray-700", !nsfwEnabled);
}

function renderCharacters(filterTag = "All", searchQuery = "") {
  const grid = document.getElementById("characterGrid");
  grid.innerHTML = "";

  const q = searchQuery.toLowerCase();
  const filtered = charactersData.filter(c =>
    (filterTag === "All" || c.tag === filterTag) &&
    (c.name.toLowerCase().includes(q) || c.tag.toLowerCase().includes(q))
  );

  if (!filtered.length) {
    grid.innerHTML = `<div class="col-span-full text-center py-12 text-sm text-gray-500">No characters found.</div>`;
    return;
  }

  filtered.forEach(char => {
    const card = document.createElement("div");
    card.className = "bg-[#121721]/80 backdrop-blur-md border border-[#222b3d] hover:border-purple-500/50 rounded-2xl p-4 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1 shadow-lg hover:shadow-purple-950/30 group cursor-pointer";
    card.onclick = () => openChat(char.id);

    card.innerHTML = `
      <div>
        <div class="relative h-44 rounded-xl bg-gradient-to-br from-purple-950/60 via-[#0b0e14] to-pink-950/40 flex items-center justify-center text-6xl mb-3.5 overflow-hidden border border-[#222b3d]/60">
          <span class="group-hover:scale-110 transition-transform duration-300 drop-shadow-md">
            ${char.avatar}
          </span>
          <span class="absolute top-2.5 left-2.5 bg-black/60 backdrop-blur-sm text-[9px] font-bold text-purple-300 px-2.5 py-0.5 rounded-full border border-purple-500/30 uppercase tracking-wider">
            Roleplay
          </span>
          <span class="absolute bottom-2.5 right-2.5 bg-black/60 backdrop-blur-sm text-[9px] text-gray-300 px-2 py-0.5 rounded-md font-semibold">
            ${escapeHtml(char.tag)}
          </span>
        </div>

        <div class="flex items-center justify-between mb-1">
          <h3 class="font-bold text-base text-white group-hover:text-purple-400 transition-colors">
            ${escapeHtml(char.name)}
          </h3>
          <span class="text-[10px] text-gray-500">
            ${escapeHtml(char.creator)}
          </span>
        </div>

        <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed mb-4">
          ${escapeHtml(char.tagline)}
        </p>
      </div>

      <div class="flex items-center justify-between pt-3 border-t border-[#222b3d]/60 text-xs text-gray-500">
        <span class="font-medium text-gray-400">
          <i class="fa-solid fa-message text-[10px] mr-1 text-purple-400"></i>
          ${escapeHtml(char.stats)}
        </span>
        <button
          type="button"
          onclick="event.stopPropagation();openChat('${char.id}')"
          class="bg-white text-[#0b0e14] hover:bg-purple-100 font-bold px-3.5 py-1.5 rounded-xl transition-colors text-xs shadow-sm">
          Chat Now
        </button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function filterByTag(tag, btn) {
  currentTag = tag;
  document.querySelectorAll(".tag-btn").forEach(b => {
    b.className = "tag-btn whitespace-nowrap px-4 py-2.5 rounded-xl bg-[#121721]/90 border border-[#222b3d] text-gray-300 hover:text-white transition-all";
  });
  btn.className = "tag-btn whitespace-nowrap px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white transition-all shadow-md shadow-purple-950/40";
  filterCharacters();
}

function filterCharacters() {
  renderCharacters(currentTag, document.getElementById("searchInput").value);
}

function openChat(charId) {
  activeCharacter = charactersData.find(c => c.id === charId);
  if (!activeCharacter) return;

  document.getElementById("modalName").textContent = activeCharacter.name;
  document.getElementById("modalAvatar").textContent = activeCharacter.avatar;

  const modal = document.getElementById("chatModal");
  modal.classList.remove("hidden");
  modal.classList.add("flex");

  if (!chatHistories[charId]) {
    chatHistories[charId] = [
      { sender: "ai", text: activeCharacter.greeting }
    ];
  }

  renderChatMessages();
  setTimeout(() => {
    document.getElementById("chatInput").focus();
  }, 100);
}

function closeChat() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
  const modal = document.getElementById("chatModal");
  modal.classList.remove("flex");
  modal.classList.add("hidden");
  requestInFlight = false;
}

function resetCurrentChat() {
  if (!activeCharacter || requestInFlight) return;
  chatHistories[activeCharacter.id] = [
    { sender: "ai", text: activeCharacter.greeting }
  ];
  renderChatMessages();
}

function renderChatMessages() {
  const container = document.getElementById("chatMessages");
  container.innerHTML = "";

  (chatHistories[activeCharacter.id] || []).forEach(msg => {
    appendBubble(msg.sender, msg.text, false);
  });

  container.scrollTop = container.scrollHeight;
}

function appendBubble(sender, text, isAnimated = false) {
  const container = document.getElementById("chatMessages");
  const wrap = document.createElement("div");

  wrap.className = `flex flex-col ${sender === "user" ? "items-end" : "items-start"} mb-3 animate-fade-in`;

  const bubble = document.createElement("div");
  bubble.className = sender === "user"
    ? "max-w-[85%] bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl rounded-br-sm px-4 py-3 text-xs md:text-sm leading-relaxed shadow-lg shadow-purple-950/30 whitespace-pre-wrap"
    : "max-w-[85%] bg-[#121721] border border-[#222b3d] text-gray-200 rounded-2xl rounded-bl-sm px-4 py-3 text-xs md:text-sm leading-relaxed shadow-md whitespace-pre-wrap";

  wrap.appendChild(bubble);

  if (sender === "ai") {
    const controls = document.createElement("div");
    controls.className = "flex items-center gap-2 mt-1.5 ml-1";

    const listen = document.createElement("button");
    listen.className = "bg-[#0b0e14] border border-[#222b3d] hover:border-purple-500/50 text-gray-400 hover:text-white text-[11px] px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition cursor-pointer";
    listen.innerHTML = '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';
    listen.dataset.ttsButton = "1";

    listen.onclick = () => {
      const currentContent = bubble.textContent;
      if (textContainsLaugh(currentContent)) {
        playLaughSound();
      } else {
        speakText(currentContent, listen);
      }
    };

    controls.appendChild(listen);
    wrap.appendChild(controls);
  }

  container.appendChild(wrap);

  if (isAnimated && sender === "ai") {
    let index = 0;
    bubble.textContent = "";
    const timer = setInterval(() => {
      if (index < text.length) {
        bubble.textContent += text.charAt(index);
        index++;
        container.scrollTop = container.scrollHeight;
      } else {
        clearInterval(timer);
      }
    }, 15);
  } else {
    bubble.textContent = text;
  }

  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");

  if (!input || !activeCharacter || requestInFlight) return;

  const text = input.value.trim();
  if (!text) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    alert("API Key আবশ্যক! চ্যাট করার জন্য আপনার OpenRouter Key প্রদান করুন।");
    return;
  }

  requestInFlight = true;
  input.value = "";
  sendBtn.disabled = true;
  sendBtn.classList.add("opacity-50", "cursor-not-allowed");

  chatHistories[activeCharacter.id].push({ sender: "user", text: text });
  appendBubble("user", text, false);

  const typing = document.getElementById("typingIndicator");
  typing.classList.remove("hidden");
  typing.classList.add("flex");

  const chatMessages = document.getElementById("chatMessages");
  chatMessages.scrollTop = chatMessages.scrollHeight;

  const formattedMessages = [
    {
      role: "system",
      content: CHANDONA_SYSTEM_PROMPT
    },
    ...chatHistories[activeCharacter.id].map(m => ({
      role: m.sender === "user" ? "user" : "assistant",
      content: m.text
    }))
  ];

  try {
    const response = await fetch(API_ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`,
        "HTTP-Referer": window.location.href,
        "X-Title": "SpicyChat Web App"
      },
      body: JSON.stringify({
        model: UNCENSORED_MODEL,
        messages: formattedMessages,
        temperature: 0.8,
        top_p: 0.9,
        repetition_penalty: 1.15,
        max_tokens: 300
      })
    });

    const data = await response.json();

    typing.classList.add("hidden");
    typing.classList.remove("flex");

    if (response.ok && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
      const reply = data.choices[0].message.content.trim();
      chatHistories[activeCharacter.id].push({ sender: "ai", text: reply });
      appendBubble("ai", reply, true);

      if (textContainsLaugh(reply)) {
        setTimeout(() => { playLaughSound(); }, 150);
      }
    } else {
      let errorMsg = "Failed to get response";
      if (data && data.error && data.error.message) {
        errorMsg = data.error.message;
      }
      const finalError = `Error: ${errorMsg}`;
      chatHistories[activeCharacter.id].push({ sender: "ai", text: finalError });
      appendBubble("ai", finalError, false);
    }
  } catch (e) {
    typing.classList.add("hidden");
    typing.classList.remove("flex");
    const errorMsg = `Connection Error: ${e.message}`;
    chatHistories[activeCharacter.id].push({ sender: "ai", text: errorMsg });
    appendBubble("ai", errorMsg, false);
  }

  requestInFlight = false;
  sendBtn.disabled = false;
  sendBtn.classList.remove("opacity-50", "cursor-not-allowed");
  input.focus();
}

function cleanForSpeech(text) {
  return text
    .replace(/\([^)]*\)/g, "")
    .replace(/[\u{1F300}-\u{1FAFF}]/gu, "")
    .replace(/[\u{1F1E6}-\u{1F1FF}]/gu, "")
    .replace(/[\u{2600}-\u{27BF}]/gu, "")
    .replace(/[\u{FE0E}\u{FE0F}\u{200D}]/gu, "")
    .replace(/\s{2,}/g, " ")
    .trim();
}

function chooseBanglaVoice() {
  if (!("speechSynthesis" in window)) return null;
  const voices = speechSynthesis.getVoices();
  const bnVoices = voices.filter(v => /^bn(?:-|_)/i.test(v.lang) || /bangla|bengali|বাংলা/i.test(v.name));
  
  // Prioritize Female Voices if available on the browser
  const femaleHints = /female|woman|girl|female voice|lekha|tithi|kalpana|ananya|aarti|priya|neela/i;
  const femaleBangla = bnVoices.find(v => femaleHints.test(v.name));
  
  return femaleBangla || bnVoices[0] || null;
}

function playLaughSound() {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const laugh = new SpeechSynthesisUtterance("হা হা হা");
  const voice = chooseBanglaVoice();
  if (voice) {
    laugh.voice = voice;
    laugh.lang = voice.lang;
  } else {
    laugh.lang = "bn-BD";
  }
  laugh.rate = 1.05;
  laugh.pitch = 1.25;
  laugh.volume = 1;
  speechSynthesis.speak(laugh);
}

function textContainsLaugh(text) {
  return /(?:হা\s*হা|হাহা|হি\s*হি|হিহি|haha|hehe|lol|😂|🤣)/i.test(text);
}

function speakText(text, btn) {
  if (!("speechSynthesis" in window)) return;

  if (speechSynthesis.speaking) {
    speechSynthesis.cancel();
    document.querySelectorAll("[data-tts-button]").forEach(b => {
      b.dataset.active = "0";
      b.innerHTML = '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';
    });
    if (btn.dataset.active === "1") {
      btn.dataset.active = "0";
      return;
    }
  }

  const cleanText = cleanForSpeech(text);
  if (!cleanText) return;

  const utterance = new SpeechSynthesisUtterance(cleanText);
  const voice = chooseBanglaVoice();
  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang;
  } else {
    utterance.lang = "bn-BD";
  }
  utterance.rate = 0.90;
  utterance.pitch = 1.15;
  utterance.volume = 1;

  btn.dataset.ttsButton = "1";
  btn.dataset.active = "1";
  btn.innerHTML = '<i class="fa-solid fa-stop text-pink-400"></i><span>Stop</span>';

  const reset = () => {
    btn.dataset.active = "0";
    btn.innerHTML = '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';
  };

  utterance.onend = reset;
  utterance.onerror = reset;
  speechSynthesis.speak(utterance);
}

if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => {
    speechSynthesis.getVoices();
  };
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

renderCharacters();
</script>
