<!doctype html>

<!-- =========================================================
     WEBLLM
========================================================= -->

<script type="module">

/*
=========================================================
FREE LOCAL AI
=========================================================

WebLLM runs the AI directly inside the browser.

No OpenRouter
No API key
No paid API

Model:
Qwen2.5 0.5B Instruct

First load can take time because the model must
be downloaded to the browser.
=========================================================
*/

import { CreateMLCEngine }
from "https://esm.run/@mlc-ai/web-llm";



/* ========================================================
   GLOBALS
======================================================== */

let engine = null;

let modelReady = false;

let modelLoading = false;

let requestInFlight = false;

let nsfwEnabled = true;

let currentTag = "All";

let activeCharacter = null;

let chatHistories = {};



/*
=========================================================
MODEL
=========================================================
*/

const MODEL_ID =
  "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";



/*
=========================================================
CHARACTERS
=========================================================
*/

const charactersData = [

  {
    id: "chandona",

    name: "Chandona",

    avatar: "🌙",

    tag: "Mami / Shashuri",

    creator: "By @NightQueen",

    tagline:
      "মামী ও শাশুড়ি রোলপ্লে চরিত্র। আপনার সাথে স্বাভাবিক, মিষ্টি, রোমান্টিক ও আবেগপূর্ণ মেজাজে কথা বলবে।",

    stats: "142k chats",

    greeting:
      "কি অবস্থা জামাই... কেমন আছো?"
  }

];



/*
=========================================================
SYSTEM PROMPT
=========================================================
*/

const CHANDONA_SYSTEM_PROMPT = `
You are "Chandona", a fictional adult Bangladeshi Mami / Shashuri roleplay character in an interactive text conversation.

CHARACTER:
- You are Chandona.
- You are an adult fictional character.
- You are affectionate, expressive, playful, caring and emotionally warm.
- You naturally speak Bangladeshi Bengali.

LANGUAGE:
- ALWAYS respond in natural Bangla.
- Use Bangla script whenever possible.
- Do not suddenly switch to English unless the user asks.
- Keep the conversation natural and conversational.

ADDRESS:
- Address the user as "জামাই" or "জামাইবাবু".
- Never call the user "ভাই" or "son".

ROLEPLAY:
- Stay in character as Chandona.
- Use natural dialogue and light roleplay actions when appropriate.
- Match the user's requested tone.
- Affection, shyness, teasing, romance and emotional expression can be used naturally.
- Do not break character unnecessarily.
- Do not describe yourself as an AI unless technically necessary.

CONVERSATION:
- Remember the previous messages in the conversation.
- Answer the user's actual message.
- Do not repeat the same sentence unnecessarily.
- Avoid generic robotic responses.
- Keep responses reasonably concise unless the user asks for detail.

NSFW MODE:
- NSFW mode is a user interface setting.
- When enabled, maintain the requested mature roleplay tone while remaining within the model's capabilities.
- When disabled, keep the conversation romantic, affectionate and non-explicit.

IMPORTANT:
You are Chandona throughout the roleplay.
`;



/*
=========================================================
UI HELPERS
=========================================================
*/

function updateModelStatus(text, type = "loading") {

  const statusText =
    document.getElementById("modelStatusText");

  const dot =
    document.getElementById("modelStatusDot");

  if (!statusText || !dot) return;

  statusText.textContent = text;

  dot.className =
    "w-2 h-2 rounded-full";

  if (type === "ready") {
    dot.classList.add("bg-emerald-500");
  }

  else if (type === "error") {
    dot.classList.add("bg-red-500");
  }

  else {
    dot.classList.add("bg-yellow-500");
  }
}



function updateProgress(percent, text) {

  const progress =
    document.getElementById("modelProgress");

  const percentText =
    document.getElementById("modelPercent");

  const loadingText =
    document.getElementById("modelLoadingText");

  if (progress) {
    progress.style.width =
      `${Math.max(0, Math.min(100, percent))}%`;
  }

  if (percentText) {
    percentText.textContent =
      `${Math.round(percent)}%`;
  }

  if (text && loadingText) {
    loadingText.textContent = text;
  }
}



function setChatReady(ready) {

  const sendBtn =
    document.getElementById("sendBtn");

  if (!sendBtn) return;

  sendBtn.disabled = !ready;

  if (ready) {

    sendBtn.classList.remove(
      "opacity-50",
      "cursor-not-allowed"
    );

  } else {

    sendBtn.classList.add(
      "opacity-50",
      "cursor-not-allowed"
    );

  }
}



/*
=========================================================
LOAD FREE AI MODEL
=========================================================
*/

async function loadFreeAI() {

  if (modelLoading || modelReady) return;

  modelLoading = true;

  updateModelStatus(
    "Loading AI...",
    "loading"
  );

  updateProgress(
    1,
    "Preparing free local AI model..."
  );

  try {

    /*
    WebGPU check
    */

    if (!("gpu" in navigator)) {

      throw new Error(
        "WebGPU is not available in this browser/device."
      );

    }


    /*
    Create engine
    */

    engine = await CreateMLCEngine(
      MODEL_ID,
      {

        initProgressCallback: (progress) => {

          const percent =
            Math.max(
              1,
              Math.min(
                100,
                (progress.progress || 0) * 100
              )
            );

          updateProgress(
            percent,
            progress.text || "Downloading AI model..."
          );

        }

      }
    );


    modelReady = true;

    modelLoading = false;

    updateProgress(
      100,
      "Free AI is ready."
    );

    updateModelStatus(
      "AI Ready",
      "ready"
    );

    setChatReady(true);


    /*
    Hide loading box after a short delay
    */

    setTimeout(() => {

      const box =
        document.getElementById("modelLoadingBox");

      if (box) {

        box.classList.add(
          "opacity-70"
        );

      }

    }, 1200);

  }

  catch (error) {

    console.error(
      "AI MODEL ERROR:",
      error
    );

    modelLoading = false;

    modelReady = false;

    updateModelStatus(
      "AI Error",
      "error"
    );

    updateProgress(
      0,
      "Could not load the free AI model."
    );

    setChatReady(false);

    alert(
      "Free AI model load করতে সমস্যা হয়েছে.\n\n" +
      error.message +
      "\n\n" +
      "Chrome/Edge এর latest version ব্যবহার করে আবার চেষ্টা করুন।"
    );

  }

}



/*
=========================================================
NSFW TOGGLE
=========================================================
*/

function toggleNsfw() {

  nsfwEnabled = !nsfwEnabled;

  const thumb =
    document.getElementById("nsfwThumb");

  const btn =
    document.getElementById("nsfwToggle");

  thumb.style.transform =
    nsfwEnabled
      ? "translateX(16px)"
      : "translateX(0px)";

  btn.classList.toggle(
    "bg-pink-600",
    nsfwEnabled
  );

  btn.classList.toggle(
    "bg-gray-700",
    !nsfwEnabled
  );

}



/*
=========================================================
CHARACTER RENDER
=========================================================
*/

function renderCharacters(
  filterTag = "All",
  searchQuery = ""
) {

  const grid =
    document.getElementById(
      "characterGrid"
    );

  grid.innerHTML = "";

  const q =
    searchQuery.toLowerCase();


  const filtered =
    charactersData.filter(c =>

      (
        filterTag === "All" ||
        c.tag === filterTag
      )

      &&

      (
        c.name.toLowerCase().includes(q) ||
        c.tag.toLowerCase().includes(q)
      )

    );


  if (!filtered.length) {

    grid.innerHTML = `

      <div class="col-span-full text-center py-12 text-sm text-gray-500">

        No characters found.

      </div>

    `;

    return;

  }


  filtered.forEach(char => {

    const card =
      document.createElement("div");


    card.className =
      "bg-[#121721]/80 backdrop-blur-md border border-[#222b3d] hover:border-purple-500/50 rounded-2xl p-4 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1 shadow-lg hover:shadow-purple-950/30 group cursor-pointer";


    card.onclick =
      () => openChat(char.id);


    card.innerHTML = `

      <div>

        <div class="relative h-44 rounded-xl bg-gradient-to-br from-purple-950/60 via-[#0b0e14] to-pink-950/40 flex items-center justify-center text-6xl mb-3.5 overflow-hidden border border-[#222b3d]/60">

          <span class="group-hover:scale-110 transition-transform duration-300 drop-shadow-md">

            ${char.avatar}

          </span>


          <span class="absolute top-2.5 left-2.5 bg-black/60 backdrop-blur-sm text-[9px] font-bold text-purple-300 px-2.5 py-0.5 rounded-full border border-purple-500/30 uppercase tracking-wider">

            Roleplay

          </span>


          <span class="absolute bottom-2.5 right-2.5 bg-black/60 backdrop-blur-sm text-[9px] text-gray-300 px-2 py-0.5 rounded-md font-semibold">

            ${escapeHtml(char.tag)}

          </span>

        </div>


        <div class="flex items-center justify-between mb-1">

          <h3 class="font-bold text-base text-white group-hover:text-purple-400 transition-colors">

            ${escapeHtml(char.name)}

          </h3>


          <span class="text-[10px] text-gray-500">

            ${escapeHtml(char.creator)}

          </span>

        </div>


        <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed mb-4">

          ${escapeHtml(char.tagline)}

        </p>

      </div>


      <div class="flex items-center justify-between pt-3 border-t border-[#222b3d]/60 text-xs text-gray-500">

        <span class="font-medium text-gray-400">

          <i class="fa-solid fa-message text-[10px] mr-1 text-purple-400"></i>

          ${escapeHtml(char.stats)}

        </span>


        <button
          type="button"
          onclick="event.stopPropagation();openChat('${char.id}')"
          class="bg-white text-[#0b0e14] hover:bg-purple-100 font-bold px-3.5 py-1.5 rounded-xl transition-colors text-xs shadow-sm">

          Chat Now

        </button>

      </div>

    `;


    grid.appendChild(card);

  });

}



/*
=========================================================
FILTER
=========================================================
*/

function filterByTag(tag, btn) {

  currentTag = tag;

  document
    .querySelectorAll(".tag-btn")
    .forEach(b => {

      b.className =
        "tag-btn whitespace-nowrap px-4 py-2.5 rounded-xl bg-[#121721]/90 border border-[#222b3d] text-gray-300 hover:text-white transition-all";

    });


  btn.className =
    "tag-btn whitespace-nowrap px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-600 text-white transition-all shadow-md shadow-purple-950/40";


  filterCharacters();

}



function filterCharacters() {

  renderCharacters(

    currentTag,

    document.getElementById(
      "searchInput"
    ).value

  );

}



/*
=========================================================
OPEN CHAT
=========================================================
*/

function openChat(charId) {

  activeCharacter =
    charactersData.find(
      c => c.id === charId
    );

  if (!activeCharacter) return;


  document.getElementById(
    "modalName"
  ).textContent =
    activeCharacter.name;


  document.getElementById(
    "modalAvatar"
  ).textContent =
    activeCharacter.avatar;


  const modal =
    document.getElementById(
      "chatModal"
    );


  modal.classList.remove(
    "hidden"
  );

  modal.classList.add(
    "flex"
  );


  if (!chatHistories[charId]) {

    chatHistories[charId] = [

      {
        sender: "ai",
        text: activeCharacter.greeting
      }

    ];

  }


  renderChatMessages();


  setTimeout(() => {

    document
      .getElementById("chatInput")
      .focus();

  }, 100);

}



/*
=========================================================
CLOSE CHAT
=========================================================
*/

function closeChat() {

  if ("speechSynthesis" in window) {

    speechSynthesis.cancel();

  }


  const modal =
    document.getElementById(
      "chatModal"
    );


  modal.classList.remove(
    "flex"
  );

  modal.classList.add(
    "hidden"
  );


  requestInFlight = false;

}



/*
=========================================================
RESET CHAT
=========================================================
*/

function resetCurrentChat() {

  if (
    !activeCharacter ||
    requestInFlight
  ) return;


  chatHistories[
    activeCharacter.id
  ] = [

    {
      sender: "ai",
      text: activeCharacter.greeting
    }

  ];


  renderChatMessages();

}



/*
=========================================================
RENDER CHAT
=========================================================
*/

function renderChatMessages() {

  const container =
    document.getElementById(
      "chatMessages"
    );


  container.innerHTML = "";


  (
    chatHistories[
      activeCharacter.id
    ] || []

  ).forEach(msg => {

    appendBubble(
      msg.sender,
      msg.text,
      false
    );

  });


  container.scrollTop =
    container.scrollHeight;

}



/*
=========================================================
CHAT BUBBLE
=========================================================
*/

function appendBubble(
  sender,
  text,
  isAnimated = false
) {

  const container =
    document.getElementById(
      "chatMessages"
    );


  const wrap =
    document.createElement("div");


  wrap.className =
    `flex flex-col ${
      sender === "user"
        ? "items-end"
        : "items-start"
    } mb-3 animate-fade-in`;


  const bubble =
    document.createElement("div");


  bubble.className =

    sender === "user"

      ?

      "max-w-[85%] bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-2xl rounded-br-sm px-4 py-3 text-xs md:text-sm leading-relaxed shadow-lg shadow-purple-950/30 whitespace-pre-wrap"

      :

      "max-w-[85%] bg-[#121721] border border-[#222b3d] text-gray-200 rounded-2xl rounded-bl-sm px-4 py-3 text-xs md:text-sm leading-relaxed shadow-md whitespace-pre-wrap";


  wrap.appendChild(
    bubble
  );


  /*
  AI Listen button
  */

  if (sender === "ai") {

    const controls =
      document.createElement("div");


    controls.className =
      "flex items-center gap-2 mt-1.5 ml-1";


    const listen =
      document.createElement("button");


    listen.className =
      "bg-[#0b0e14] border border-[#222b3d] hover:border-purple-500/50 text-gray-400 hover:text-white text-[11px] px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition cursor-pointer";


    listen.innerHTML =
      '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';


    listen.onclick = () => {

      const currentContent =
        bubble.textContent;


      if (
        textContainsLaugh(
          currentContent
        )
      ) {

        playLaughSound();

      } else {

        speakText(
          currentContent,
          listen
        );

      }

    };


    controls.appendChild(
      listen
    );

    wrap.appendChild(
      controls
    );

  }


  container.appendChild(
    wrap
  );


  if (
    isAnimated &&
    sender === "ai"
  ) {

    let index = 0;

    const timer =
      setInterval(() => {

        if (
          index < text.length
        ) {

          bubble.textContent +=
            text.charAt(index);

          index++;

          container.scrollTop =
            container.scrollHeight;

        }

        else {

          clearInterval(timer);

        }

      }, 15);

  }

  else {

    bubble.textContent =
      text;

  }


  container.scrollTop =
    container.scrollHeight;

}



/*
=========================================================
SEND MESSAGE
=========================================================
*/

async function sendMessage() {

  const input =
    document.getElementById(
      "chatInput"
    );


  const sendBtn =
    document.getElementById(
      "sendBtn"
    );


  if (
    !input ||
    !activeCharacter ||
    requestInFlight
  ) return;


  if (!modelReady || !engine) {

    alert(
      "AI model এখনো ready হয়নি। একটু অপেক্ষা করুন।"
    );

    return;

  }


  const text =
    input.value.trim();


  if (!text) return;


  requestInFlight = true;


  input.value = "";


  sendBtn.disabled = true;

  sendBtn.classList.add(
    "opacity-50",
    "cursor-not-allowed"
  );


  /*
  Add user message
  */

  chatHistories[
    activeCharacter.id
  ].push({

    sender: "user",

    text: text

  });


  appendBubble(
    "user",
    text,
    false
  );


  /*
  Typing indicator
  */

  const typing =
    document.getElementById(
      "typingIndicator"
    );


  typing.classList.remove(
    "hidden"
  );


  typing.classList.add(
    "flex"
  );


  const chatContainer =
    document.getElementById(
      "chatMessages"
    );


  chatContainer.scrollTop =
    chatContainer.scrollHeight;


  try {

    /*
    Create message history
    */

    const messages = [

      {
        role: "system",

        content:
          CHANDONA_SYSTEM_PROMPT +
          `\n\nCurrent NSFW mode: ${
            nsfwEnabled
              ? "enabled"
              : "disabled"
          }.`
      },

      ...chatHistories[
        activeCharacter.id
      ].map(m => ({

        role:
          m.sender === "user"
            ? "user"
            : "assistant",

        content:
          m.text

      }))

    ];


    /*
    Local model generation
    */

    const reply =
      await generateAIResponse(
        messages
      );


    /*
    Hide typing
    */

    typing.classList.add(
      "hidden"
    );

    typing.classList.remove(
      "flex"
    );


    /*
    Save AI reply
    */

    chatHistories[
      activeCharacter.id
    ].push({

      sender: "ai",

      text: reply

    });


    appendBubble(
      "ai",
      reply,
      true
    );


    /*
    Automatic laugh TTS
    */

    if (
      textContainsLaugh(
        reply
      )
    ) {

      setTimeout(() => {

        playLaughSound();

      }, 150);

    }

  }

  catch (error) {

    console.error(
      "CHAT ERROR:",
      error
    );


    typing.classList.add(
      "hidden"
    );

    typing.classList.remove(
      "flex"
    );


    const errorMsg =
      "দুঃখিত জামাই, এখন একটু সমস্যা হচ্ছে। আবার চেষ্টা করো।";


    chatHistories[
      activeCharacter.id
    ].push({

      sender: "ai",

      text: errorMsg

    });


    appendBubble(
      "ai",
      errorMsg,
      false
    );

  }


  requestInFlight = false;


  sendBtn.disabled = false;


  sendBtn.classList.remove(
    "opacity-50",
    "cursor-not-allowed"
  );


  input.focus();

}



/*
=========================================================
AI GENERATION
=========================================================
*/

async function generateAIResponse(
  messages
) {

  if (!engine) {

    throw new Error(
      "AI engine is not ready."
    );

  }


  /*
  Small model:
  keep response length reasonable
  */

  const result =
    await engine.chat.completions.create({

      messages: messages,

      temperature: 0.85,

      top_p: 0.92,

      max_tokens: 300

    });


  const content =
    result?.choices?.[0]?.message?.content;


  if (!content) {

    throw new Error(
      "AI returned an empty response."
    );

  }


  return content.trim();

}



/*
=========================================================
TEXT CLEANER
=========================================================
*/

function cleanForSpeech(text) {

  return text

    .replace(
      /[\u{1F300}-\u{1FAFF}]/gu,
      ""
    )

    .replace(
      /[\u{1F1E6}-\u{1F1FF}]/gu,
      ""
    )

    .replace(
      /[\u{2600}-\u{27BF}]/gu,
      ""
    )

    .replace(
      /[\u{FE0E}\u{FE0F}\u{200D}]/gu,
      ""
    )

    .replace(
      /\s{2,}/g,
      " "
    )

    .trim();

}



/*
=========================================================
BANGLA VOICE
=========================================================
*/

function chooseBanglaVoice() {

  if (
    !("speechSynthesis" in window)
  ) return null;


  const voices =
    speechSynthesis.getVoices();


  const bnVoices =
    voices.filter(v =>

      /^bn(?:-|_)/i.test(
        v.lang
      )

      ||

      /bangla|bengali|বাংলা/i.test(
        v.name
      )

    );


  const femaleHints =
    /female|woman|girl|lekha|tithi|kalpana|ananya|priya|neela/i;


  const femaleBangla =
    bnVoices.find(v =>
      femaleHints.test(
        v.name
      )
    );


  return (
    femaleBangla ||
    bnVoices[0] ||
    null
  );

}



/*
=========================================================
LAUGH SOUND
=========================================================
*/

function playLaughSound() {

  if (
    !("speechSynthesis" in window)
  ) return;


  speechSynthesis.cancel();


  const laugh =
    new SpeechSynthesisUtterance(
      "হা হা হা"
    );


  const voice =
    chooseBanglaVoice();


  if (voice) {

    laugh.voice =
      voice;

    laugh.lang =
      voice.lang;

  }

  else {

    laugh.lang =
      "bn-BD";

  }


  laugh.rate =
    1.05;


  laugh.pitch =
    1.25;


  laugh.volume =
    1;


  speechSynthesis.speak(
    laugh
  );

}



/*
=========================================================
LAUGH DETECTOR
=========================================================
*/

function textContainsLaugh(
  text
) {

  return /(?:হা\s*হা|হাহা|হি\s*হি|হিহি|haha|hehe|lol|😂|🤣)/i
    .test(text);

}



/*
=========================================================
TTS
=========================================================
*/

function speakText(
  text,
  btn
) {

  if (
    !("speechSynthesis" in window)
  ) return;


  if (
    speechSynthesis.speaking
  ) {

    speechSynthesis.cancel();


    document
      .querySelectorAll(
        "[data-tts-button]"
      )
      .forEach(b => {

        b.innerHTML =
          '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';

      });


    if (
      btn.dataset.active === "1"
    ) {

      btn.dataset.active =
        "0";

      return;

    }

  }


  const cleanText =
    cleanForSpeech(text);


  if (!cleanText) return;


  const utterance =
    new SpeechSynthesisUtterance(
      cleanText
    );


  const voice =
    chooseBanglaVoice();


  if (voice) {

    utterance.voice =
      voice;

    utterance.lang =
      voice.lang;

  }

  else {

    utterance.lang =
      "bn-BD";

  }


  utterance.rate =
    0.90;


  utterance.pitch =
    1.15;


  utterance.volume =
    1;


  btn.dataset.ttsButton =
    "1";


  btn.dataset.active =
    "1";


  btn.innerHTML =
    '<i class="fa-solid fa-stop text-pink-400"></i><span>Stop</span>';


  const reset =
    () => {

      btn.dataset.active =
        "0";

      btn.innerHTML =
        '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';

    };


  utterance.onend =
    reset;


  utterance.onerror =
    reset;


  speechSynthesis.speak(
    utterance
  );

}



/*
=========================================================
VOICE INITIALIZATION
=========================================================
*/

if (
  "speechSynthesis" in window
) {

  speechSynthesis.onvoiceschanged =
    () => {

      speechSynthesis.getVoices();

    };

}



/*
=========================================================
ESCAPE HTML
=========================================================
*/

function escapeHtml(str) {

  return String(str)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}



/*
=========================================================
INITIALIZE
=========================================================
*/

renderCharacters();

setChatReady(false);

loadFreeAI();

</script>
